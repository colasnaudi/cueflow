name: cueflow

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: cueflow
      POSTGRES_PASSWORD: cueflow
      POSTGRES_DB: cueflow
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cueflow"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
